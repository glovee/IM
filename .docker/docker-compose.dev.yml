name: IM_frontend_dev
services:
  frontend:
    build:
      context: ..
      dockerfile: .docker/frontend/Dockerfile.dev
    working_dir: /app
    volumes:
      - ../frontend:/app:rw
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "mkdir -p /app/node_modules && (find /app/node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true) && npm cache clean --force && npm ci --prefer-online --no-audit && npm run dev -- --host 0.0.0.0"

volumes:
  frontend_node_modules:
